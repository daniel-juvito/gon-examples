name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The gon version the examples and expected.txt are pinned to. Bump it on
  # purpose, together with the READMEs and expected.txt.
  GON_VERSION: v1.13.0

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # gon v1.13.0 requires Go >= 1.27.0.
          go-version: '1.27.0'

      - name: Install gon
        run: |
          go install "github.com/daniel-juvito/gon/cmd/gon@${GON_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gon version
        run: gon version

      - name: Check the examples against expected.txt
        run: scripts/check-examples.sh

      - name: Transpile and build the transpile-dir example
        # `.go` files are generated and not committed, so this starts from a tree
        # with none: dependency order matters, and a file alone does not check.
        working-directory: transpile-dir
        run: |
          ! gon transpile shop/price.gon 2>/dev/null
          gon transpile ./...
          gon check ./...
          gon build ./cmd/app
          test "$(./app)" = "total: 15"
